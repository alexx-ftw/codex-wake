[package]
name = "codex-wake"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
hmac = "0.12"
libc = "0.2"
regex = "1"
rmcp = { version = "3.8.0", features = ["server", "transport-io", "schemars"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process", "time"] }
tungstenite = "0.30.0"
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"
