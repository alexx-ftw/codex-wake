name: Isolated alpha2 VM laboratory
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA selected for this manual run
        required: true
        type: string
permissions:
  contents: read
jobs:
  laboratory:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check source SHA and safety regressions
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          node --test scripts/alpha2-vm/test.mjs
      - name: Build pinned inputs and boot disposable guest
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: bash scripts/alpha2-vm/ci.sh "$EXPECTED_SHA" "$RUNNER_TEMP/alpha2-vm"
      - name: Preserve evidence from this exact run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha2-vm-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alpha2-vm/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
