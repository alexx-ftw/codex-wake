name: Tests
run-name: "codex-wake ${{ inputs.probe || github.sha }}"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      probe:
        description: Identifier for an explicitly requested webhook smoke test
        required: false
        default: manual

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.probe != 'wake-native-duplicate' && inputs.probe != 'wake-goal-race' && inputs.probe != 'wake-validation-hooks'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Registration window for manual webhook probes
        if: github.event_name == 'workflow_dispatch'
        run: sleep 20
      - name: Obtain verified receiver for HTTP tests
        run: |
          mkdir -p .tools
          curl --fail --location --max-time 60 --silent --show-error \
            --output .tools/webhook.tar.gz \
            https://github.com/adnanh/webhook/releases/download/2.8.3/webhook-linux-amd64.tar.gz
          printf '%s  %s\n' \
            3cdf93f0615f11bfc575c158d0d613666394228f6e830ff6f792178933773f7b \
            .tools/webhook.tar.gz | sha256sum --check
          tar -xzf .tools/webhook.tar.gz -C .tools webhook-linux-amd64/webhook
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and real HTTP tests with fake Codex
        env:
          CODEX_WAKE_WEBHOOK: ${{ github.workspace }}/.tools/webhook-linux-amd64/webhook
        run: |
          cargo test --locked --bin codex-wake
          cargo test --locked --test hooks
          cargo test --locked --test release
          cargo test --locked --test telemetry
          cargo test --locked --test http -- --include-ignored

  package:
    if: github.event_name != 'workflow_dispatch' || inputs.probe != 'wake-native-duplicate' && inputs.probe != 'wake-goal-race' && inputs.probe != 'wake-validation-hooks'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain and musl compiler
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add --toolchain 1.98.0 x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build Linux x86_64 binary
        env:
          CC: musl-gcc
        run: rustup run 1.98.0 cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Package and verify repeatability
        run: |
          sh scripts/package-release.sh target/x86_64-unknown-linux-musl/release/codex-wake .test-results/release-one
          sh scripts/package-release.sh target/x86_64-unknown-linux-musl/release/codex-wake .test-results/release-two
          cmp .test-results/release-one/*.tar.gz .test-results/release-two/*.tar.gz
          cd .test-results/release-one
          sha256sum --check SHA256SUMS
      - name: Preserve release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x86_64-release-candidate
          path: .test-results/release-one/
          if-no-files-found: error

  native-duplicate-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.probe == 'wake-native-duplicate'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned tooling
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          npm install --prefix "$RUNNER_TEMP/wake-deps" @openai/codex@0.166.0 ws@8.18.3
      - name: Build Wake
        run: rustup run 1.98.0 cargo build --locked
      - name: Verify duplicate receipt and warning in isolation
        env:
          NODE_PATH: ${{ runner.temp }}/wake-deps/node_modules
          WAKE_TEST_CODEX: ${{ runner.temp }}/wake-deps/node_modules/.bin/codex
          WAKE_TEST_BINARY: ${{ github.workspace }}/target/debug/codex-wake
        run: node tests/cloud-native-queue-probe.cjs --duplicate

  goal-race-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.probe == 'wake-goal-race'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned tooling
        run: npm install --prefix "$RUNNER_TEMP/wake-deps" @openai/codex@0.166.0 ws@8.18.3
      - name: Verify concurrent goal pause behavior in isolation
        env:
          NODE_PATH: ${{ runner.temp }}/wake-deps/node_modules
          WAKE_TEST_CODEX: ${{ runner.temp }}/wake-deps/node_modules/.bin/codex
        run: node tests/cloud-goal-race.cjs

  validation-hooks-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.probe == 'wake-validation-hooks'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Run isolated Stop process integration test
        run: cargo test --locked --test validation_hooks
